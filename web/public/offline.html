<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031412">
<title>Sin conexión · FA CUP Chile</title>
<style>
  html,body{height:100%;margin:0}
  body{background:radial-gradient(120% 70% at 50% 0%,#0d4a38 0%,#07281f 48%,#031412 100%);color:#f2f7f4;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));text-align:center}
  main{max-width:360px}
  .anillo{width:64px;height:64px;border-radius:50%;border:3px solid #008d36;margin:0 auto 28px;display:flex;align-items:center;justify-content:center}
  .anillo i{width:10px;height:10px;border-radius:50%;background:#95c11f;opacity:.9}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
  p{margin:0 0 28px;color:#a9bdb4;line-height:1.5}
  button{font:inherit;font-weight:600;color:#fff;background:#008d36;border:0;border-radius:12px;padding:14px 28px;min-height:48px;cursor:pointer}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid #95c11f;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="anillo" aria-hidden="true"><i></i></div>
  <h1>Sin conexión</h1>
  <p>Revisa tu internet y vuelve a intentar.</p>
  <button type="button" id="reintentar">Reintentar</button>
</main>
<script>
  document.getElementById("reintentar").addEventListener("click", function () { location.reload(); });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
