[theme]
base = "light"
primaryColor = "#15803d"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
headingFontWeights = [900, 800, 800]
baseRadius = "0.9rem"
buttonRadius = "0.9rem"
borderColor = "#e2e8f0"
showWidgetBorder = true
chartCategoricalColors = ["#15803d", "#ef4444", "#2563eb", "#f59e0b", "#8b5cf6"]

[browser]
gatherUsageStats = false
